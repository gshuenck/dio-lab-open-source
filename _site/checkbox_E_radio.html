<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkbox e Radio</title>
</head>
<body>
<form method="get">
<h3>Voce selecionou: Pizza de Calabresa</h3>
<p>Quais Opcionais você deseja?</p>
<input type="checkbox" name="opcionaisl[]" value="queijo"> + queijo <br>
<input type="checkbox" name="opcionaisl[]" value="calabresa"> + calabresa <br>
<input type="checkbox" name="opcionaisl[]" value="cebola"> + cebola <br>
<input type="checkbox" name="opcionaisl[]" value="azeitona"> + azeitona <br>
<p>Borda recheada?</p>
<input type="radio" name="borda" value="sim"> Sim <br>
<input type="radio" name="borda" value="nao"> Não <br>
<p>Bebida</p>
<input type="radio" name="bebida" value="suco"> Suco <br>
<input type="radio" name="bebida" value="refrigerante"> refrigerante <br>
<input type="radio" name="bebida" value="agua"> Água <br>
<input type="radio" name="bebida" value="nenhum"> Nenhum <br>
<br>
<button type="submit">Evia pedido</button>

</form>    
</body>
</html>
